name: WhaDay

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "3R9ULKMUXY"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "6.0"

targets:
  WhaDayNative:
    type: application
    platform: iOS
    sources:
      - path: WhaDayNative
        excludes:
          - Purchases/WhaDay.storekit
      - path: Shared
    info:
      path: WhaDayNative/Info.plist
      properties:
        CFBundleDisplayName: WhaDay
        CFBundleURLTypes:
          - CFBundleURLName: com.gokturkgocen.whadayapp
            CFBundleURLSchemes: [whaday]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [instagram-stories]
        WhaDayInstagramSourceApplicationID: "$(INSTAGRAM_SOURCE_APPLICATION_ID)"
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64]
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIViewControllerBasedStatusBarAppearance: false
    entitlements:
      path: WhaDayNative/WhaDayNative.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gokturkgocen.whadayapp
    settings:
      base:
        PRODUCT_NAME: WhaDayNative
        PRODUCT_BUNDLE_IDENTIFIER: com.gokturkgocen.whadayapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INSTAGRAM_SOURCE_APPLICATION_ID: ""
    dependencies:
      - target: WhaDayWidgetExtension
        embed: true

  WhaDayWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WhaDayWidget
      - path: Shared
      - path: WhaDayNative/Data/tr.json
        buildPhase: resources
      - path: WhaDayNative/Data/en.json
        buildPhase: resources
      - path: WhaDayNative/Data/metadata.json
        buildPhase: resources
    info:
      path: WhaDayWidget/Info.plist
      properties:
        CFBundleDisplayName: WhaDay Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WhaDayWidget/WhaDayWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gokturkgocen.whadayapp
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.gokturkgocen.whadayapp.WhaDayWidget

  WhaDayNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhaDayNativeTests
    dependencies:
      - target: WhaDayNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gokturkgocen.whadayapp.tests

  WhaDayNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WhaDayNativeUITests
    dependencies:
      - target: WhaDayNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gokturkgocen.whadayapp.uitests

schemes:
  WhaDayNative:
    build:
      targets:
        WhaDayNative: all
        WhaDayNativeTests: [test]
        WhaDayNativeUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: WhaDayNative/Purchases/WhaDay.storekit
    test:
      config: Debug
      targets:
        - name: WhaDayNativeTests
        - name: WhaDayNativeUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
