name: WhaDay

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "3R9ULKMUXY"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "6.0"

targets:
  WhaDayNative:
    type: application
    platform: iOS
    sources:
      - path: WhaDayNative
    info:
      path: WhaDayNative/Info.plist
      properties:
        CFBundleDisplayName: WhaDay
        LSApplicationQueriesSchemes: [instagram-stories]
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIViewControllerBasedStatusBarAppearance: false
    entitlements:
      path: WhaDayNative/WhaDayNative.entitlements
    settings:
      base:
        PRODUCT_NAME: WhaDayNative
        PRODUCT_BUNDLE_IDENTIFIER: com.gokturkgocen.whadayapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: WhaDayWidgetExtension
        embed: true

  WhaDayWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WhaDayWidget
    info:
      path: WhaDayWidget/Info.plist
      properties:
        CFBundleDisplayName: WhaDay Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WhaDayWidget/WhaDayWidget.entitlements
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.gokturkgocen.whadayapp.WhaDayWidget

  WhaDayNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhaDayNativeTests
    dependencies:
      - target: WhaDayNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gokturkgocen.whadayapp.tests
