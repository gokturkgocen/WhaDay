<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhaDay — Özel Gün Paylaşımı</title>
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    .custom-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 28px;
      margin: 24px 0;
      text-align: center;
      backdrop-filter: blur(20px);
    }
    .custom-emoji {
      font-size: 56px;
      margin-bottom: 12px;
      display: block;
    }
    .custom-title {
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 8px;
      color: #fff;
    }
    .custom-desc {
      font-size: 16px;
      opacity: 0.8;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .custom-author {
      font-size: 13px;
      opacity: 0.55;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav>
      <a class="brand" href="../"><span class="mark">✱</span>WhaDay</a>
    </nav>

    <div class="custom-card" id="card">
      <span class="custom-author" id="author">Özel Gün Paylaşımı</span>
      <span class="custom-emoji" id="emoji">✨</span>
      <h1 class="custom-title" id="title">Biri seninle bir gün paylaştı</h1>
      <p class="custom-desc" id="desc">Bu özel günü WhaDay takvimine ekleyip her yıl hatırlamak için uygulamayı aç.</p>

      <div class="actions">
        <a class="button primary" id="openAppBtn" href="#">WhaDay'de Aç ve Takvime Ekle</a>
        <a class="button" href="https://apps.apple.com/tr/app/whaday/id6802225434">Uygulamayı İndir</a>
      </div>
    </div>

    <footer>© 2026 WhaDay · Her gün paylaşacak bir şey</footer>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const d = params.get('d');
    if (d) {
      const appUrl = 'whaday://custom?d=' + encodeURIComponent(d);
      document.getElementById('openAppBtn').href = appUrl;

      // Try automatic open on mobile
      if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        setTimeout(() => {
          window.location.href = appUrl;
        }, 300);
      }

      // Try decoding payload for browser preview
      try {
        let base64 = d.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4 !== 0) base64 += '=';
        const json = decodeURIComponent(escape(atob(base64)));
        const data = JSON.parse(json);
        if (data.t) document.getElementById('title').innerText = data.t;
        if (data.desc) document.getElementById('desc').innerText = data.desc;
        if (data.e) document.getElementById('emoji').innerText = data.e;
        if (data.a) document.getElementById('author').innerText = data.a + " seninle bir gün paylaştı";
      } catch (err) {
        console.log("Preview decode skipped", err);
      }
    }
  </script>
</body>
</html>
